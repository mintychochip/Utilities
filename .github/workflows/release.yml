name: Release

on:
  push:
    tags: []

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: publish to maven
        run: |
          ./gradlew :p