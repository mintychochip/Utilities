name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Extract CalVer version from git tag
        id: get_version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building CalVer release version: $VERSION"
      - name: Publish to Maven Central Portal
        run: |
          ./gradlew publishAllPublicationsToCentralPortal \
            -Pversion="${{ steps.get_version.outputs.version }}" \
            -PmavenCentralUsername="${{ secrets.MAVEN_USERNAME }}" \
            -PmavenCentralPassword="${{ secrets.MAVEN_PASSWORD }}" \
            --no-daemon --stacktrace
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
