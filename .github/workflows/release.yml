name: Release verification

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: CalVer version used for manual verification
        required: true
        default: '2026.08.27'
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Extract CalVer version
        id: get_version
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION="$MANUAL_VERSION"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "Invalid CalVer version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building CalVer release version: $VERSION"
      - name: Verify release build
        run: |
          ./gradlew clean check \
            -Pversion="${{ steps.get_version.outputs.version }}" \
            --no-daemon --stacktrace
