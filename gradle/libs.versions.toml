[versions]
paper = "26.2.build.119-stable"
spigot = "26.2-R0.1-SNAPSHOT"
hikari = "7.1.0"
jdbi = "3.54.0"
flyway = "11.19.1"
junit = "6.1.3"
sqlite = "3.45.3.0"
guava = "33.4.8-jre"
adventure = "5.2.0"
annotations = "26.1.0"
mockito = "5.14.2"
joml = "1.10.5"
spotless = "7.0.2"
maven-publish-plugin = "0.34.0"
shadow = "8.1.1"
run-paper = "3.1.0"
minestom = "2026.08.16-26.2"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
spigot-api = { module = "org.spigotmc:spigot-api", version.ref = "spigot" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
jdbi-core = { module = "org.jdbi:jdbi3-core", version.ref = "jdbi" }
jdbi-sqlobject = { module = "org.jdbi:jdbi3-sqlobject", version.ref = "jdbi" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-key = { module = "net.kyori:adventure-key", version.ref = "adventure" }
annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
adventure-text-serializer-legacy = { module = "net.kyori:adventure-text-serializer-legacy", version.ref = "adventure" }
minestom = { module = "net.minestom:minestom", version.ref = "minestom" }
joml = { module = "org.joml:joml", version.ref = "joml" }
[plugins]
maven-publish-vanniktech = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish-plugin" }
shadow = { id = "com.github.johnrengelman.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
